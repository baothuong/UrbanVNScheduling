spring.application.name=UrbanVN
# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/urbanvn
spring.datasource.username=root
spring.datasource.password=

# Multipart/Upload Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB
spring.servlet.multipart.file-size-threshold=2KB
spring.servlet.multipart.location=${java.io.tmpdir}

server.port=443
server.ssl.key-store=classpath:keystore.p12
server.ssl.key-store-password=1
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=tomcat



app.upload.directory=./uploads
app.upload.max-size=10485760
app.upload.allowed-extensions=jpg,jpeg,png,gif,pdf,doc,docx



# Show SQL for debugging
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.ddl-auto=update


# Log levels for debugging
logging.level.com.urban.EmployeeManager=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=DEBUG

# Console colors for better readability
spring.output.ansi.enabled=always

# Session Configuration for Development
server.servlet.session.timeout=30m
server.servlet.session.cookie.name=JSESSIONID
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=false
server.servlet.session.cookie.max-age=1800
server.servlet.session.cookie.path=/
server.servlet.session.cookie.same-site=lax
server.servlet.session.tracking-modes=cookie
server.servlet.session.persistent=false

# Debug session
logging.level.org.springframework.session=DEBUG


